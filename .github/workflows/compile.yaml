name: "Compile Code"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read

jobs:
  lint:
    name: "Compile Code (Node ${{ matrix.node }})"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        node: ["22", "24", "26"]
      fail-fast: false

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@v7"

      - name: "Set Up NodeJS"
        uses: "actions/setup-node@v7"
        with:
          node-version: ${{ matrix.node }}

      - name: "Install Dependencies"
        run: "npm ci"

      - name: "Compile Code"
        run: "npx tsc"
