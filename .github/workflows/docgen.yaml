name: "CI"
on:
  push:
    branches:
      - '*'
      - '!docs'
    tags:
      - '*'
  workflow_call:
    inputs:
      ref:
        description: "Full ref to generate documentation for"
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read

jobs:
  select-ref:
    if: github.repository_owner == 'fnbrjs'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ref.outputs.name }}
    steps:
      - name: Select documentation ref
        id: ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref || github.ref }}
        run: |
          case "$SOURCE_REF" in
            refs/heads/*) name="${SOURCE_REF#refs/heads/}" ;;
            refs/tags/*) name="${SOURCE_REF#refs/tags/}" ;;
            *) echo "::error::Expected a full branch or tag ref"; exit 1 ;;
          esac
          if [[ "$name" == */* ]]; then
            echo "Skipping documentation for refs containing slashes"
            exit 0
          fi
          if [[ -z "$name" ]] || ! git check-ref-format "$SOURCE_REF"; then
            echo "::error::Invalid documentation ref"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  docgen:
    needs: select-ref
    if: needs.select-ref.outputs.name != ''
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Set Up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Checkout Main Repository
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout Main Repository Docs Branch
        uses: actions/checkout@v7
        with:
          path: docs
          ref: docs
          persist-credentials: false

      - name: Create DocGen read token
        id: docgen-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fnbrjs
          repositories: docgen
          permission-contents: read

      - name: Checkout DocGen Repository
        uses: actions/checkout@v7
        with:
          repository: fnbrjs/docgen
          token: ${{ steps.docgen-token.outputs.token }}
          path: docgen
          persist-credentials: false

      - name: Install Main Repository Dependencies
        working-directory: ./main
        run: npm ci

      - name: Install DocGen Dependencies
        working-directory: ./docgen
        run: npm ci

      - name: Compile DocGen
        working-directory: ./docgen
        run: npm run build

      - name: Generate Documentation
        working-directory: ./docgen
        run: node . ../main

      - name: Create documentation write token
        id: docs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: fnbrjs
          repositories: fnbr.js
          permission-contents: write

      - name: Deploy Documentation
        working-directory: ./docs
        shell: bash
        env:
          CURRENT_BRANCH: ${{ needs.select-ref.outputs.name }}
          APP_SLUG: ${{ steps.docs-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git -c credential.helper= -c credential.helper='!gh auth git-credential' pull origin docs
          mv ../docgen/docs.json ./${CURRENT_BRANCH}.json
          git add . -A
          git commit -m "Docs build for ${CURRENT_BRANCH}: ${GITHUB_SHA}"
          git -c credential.helper= -c credential.helper='!gh auth git-credential' push origin HEAD:docs
